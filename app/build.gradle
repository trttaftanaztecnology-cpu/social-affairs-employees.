plugins {
    id 'com.android.application'
}

android {
    namespace 'com.socialaffairs.chat'
    compileSdk 35

    defaultConfig {
        applicationId 'com.socialaffairs.chat'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
}
implementation 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
